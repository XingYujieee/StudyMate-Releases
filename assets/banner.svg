<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="StudyMate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="0.55" stop-color="#16204A"/>
      <stop offset="1" stop-color="#1E1840"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5B7CFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="720" y1="0" x2="890" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- dotted grid -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <circle cx="700" cy="60" r="1.5"/><circle cx="740" cy="60" r="1.5"/><circle cx="780" cy="60" r="1.5"/><circle cx="820" cy="60" r="1.5"/>
    <circle cx="700" cy="100" r="1.5"/><circle cx="740" cy="100" r="1.5"/><circle cx="780" cy="100" r="1.5"/><circle cx="820" cy="100" r="1.5"/>
    <circle cx="1180" cy="300" r="1.5"/><circle cx="1220" cy="300" r="1.5"/><circle cx="1180" cy="340" r="1.5"/><circle cx="1220" cy="340" r="1.5"/>
  </g>

  <!-- left: wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="150" font-size="22" font-weight="600" fill="#93C5FD" letter-spacing="4">AI STUDY COMPANION · macOS</text>
    <text x="76" y="232" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="-2">StudyMate</text>
    <text x="80" y="284" font-size="26" font-weight="500" fill="#E0E7FF" fill-opacity="0.92">听懂每一节课，课后笔记自动成形</text>
    <text x="80" y="324" font-size="18" fill="#A5B4FC" fill-opacity="0.85">课堂转录 · 实时双语字幕 · 有出处的问答 · Obsidian &amp; Anki</text>
  </g>

  <!-- right: waveform → subtitle card → note card -->
  <g transform="translate(720,0)">
    <!-- waveform -->
    <g stroke="url(#wave)" stroke-width="6" stroke-linecap="round">
      <line x1="0"   y1="196" x2="0"   y2="204"/>
      <line x1="18"  y1="184" x2="18"  y2="216"/>
      <line x1="36"  y1="164" x2="36"  y2="236"/>
      <line x1="54"  y1="176" x2="54"  y2="224"/>
      <line x1="72"  y1="146" x2="72"  y2="254"/>
      <line x1="90"  y1="170" x2="90"  y2="230"/>
      <line x1="108" y1="186" x2="108" y2="214"/>
      <line x1="126" y1="160" x2="126" y2="240"/>
      <line x1="144" y1="180" x2="144" y2="220"/>
      <line x1="162" y1="192" x2="162" y2="208"/>
    </g>

    <!-- subtitle card -->
    <rect x="196" y="86" width="324" height="112" rx="16" fill="#000000" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Arial, sans-serif">
      <text x="218" y="126" font-size="17" fill="#FFFFFF">Entropy measures uncertainty…</text>
      <text x="218" y="156" font-size="17" fill="#FDE68A">熵衡量的是不确定性……</text>
      <rect x="218" y="174" width="56" height="6" rx="3" fill="#7DD3FC" fill-opacity="0.6"/>
      <rect x="282" y="174" width="34" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    </g>

    <!-- note card -->
    <rect x="236" y="216" width="304" height="132" rx="16" fill="#F8FAFC"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Arial, sans-serif">
      <text x="258" y="250" font-size="16" font-weight="700" fill="#1E293B"># L05 Information Theory</text>
      <circle cx="264" cy="276" r="3.5" fill="#6366F1"/>
      <rect x="276" y="271" width="160" height="9" rx="4.5" fill="#CBD5E1"/>
      <rect x="446" y="268" width="82" height="16" rx="8" fill="#E0E7FF"/>
      <text x="487" y="280" font-size="10" fill="#4338CA" text-anchor="middle">week5.pdf p.12</text>
      <circle cx="264" cy="300" r="3.5" fill="#6366F1"/>
      <rect x="276" y="295" width="210" height="9" rx="4.5" fill="#CBD5E1"/>
      <circle cx="264" cy="324" r="3.5" fill="#6366F1"/>
      <rect x="276" y="319" width="140" height="9" rx="4.5" fill="#CBD5E1"/>
      <rect x="422" y="316" width="48" height="16" rx="8" fill="#DCFCE7"/>
      <text x="446" y="328" font-size="10" fill="#166534" text-anchor="middle">12:34</text>
    </g>

    <!-- connectors -->
    <path d="M172 200 C 184 200, 186 150, 196 146" fill="none" stroke="#7DD3FC" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M358 198 L 358 216" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
</svg>
